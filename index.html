<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        main{
            display: flex;
            flex-grow: 1;
            
        }
        html{
            height: 100%;
        }
        header{
            
            color: purple;
            padding: 30px 80px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.250);

            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo{
            font-size: 50px;
            font-weight: 1000;
        }
        button{
            background-color: purple;
            color: white;
            border-radius: 50px;

            width: 125px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center; 
        }
        .banner{
            display: flex;
            justify-content: center;
            
            align-items: center;
            background-color: blue;
            border-radius: 50px;
            
            width: 1500px;
            margin: 30px auto;
            

        }
        .card{

        }

    </style>
</head>
<body>
    <header>
        <div class="logo">
            Dota
            Skins
        </div>
        <button>
            Корзина
        </button>
    </header>
    <div class="banner">
        <img src="png/reck.png" alt="" height="400px" width="1000px">
    </div>
    
    
</body>
</html>
